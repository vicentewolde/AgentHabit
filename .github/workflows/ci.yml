# AgentHabit CI (T1; contract jobs completed in T2). No secrets: tests touch no network, no
# Neon and no Strava.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only: the workflow never writes to the repository.
permissions:
  contents: read

# A new push cancels the previous run of the same branch or PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned by commit SHA (version in the comment): supply chain. Same pins as AgentSales.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node from .nvmrc (P-5) and the pnpm store cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fails if the lockfile is out of date; applies pnpm's release-age policy.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, types and tests
        run: pnpm check

  contracts-stellar:
    name: cargo test (Soroban)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup is preinstalled on the runner and reads contracts/stellar/rust-toolchain.toml
      # (1.98.0 + wasm32v1-none, P-8) on the first cargo call.
      - name: Contract tests
        working-directory: contracts/stellar
        run: cargo test --locked

      # soroban-sdk 29 refuses a plain `cargo build` for wasm: only `stellar contract build` (CLI
      # >= 25.2) can build a deployable contract (P-8). The action derives the CLI version from its
      # ref, which is a SHA here, so the version is passed explicitly and must match the pin.
      - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          version: 28.1.0

      - name: Build the contract for the network (wasm32v1-none)
        working-directory: contracts/stellar
        run: stellar contract build --locked

  contracts-evm:
    name: forge test (Avalanche)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # forge-std and OpenZeppelin are git submodules pinned to release tags (P-9). Their own
      # nested submodules only serve their test suites, so the checkout is not recursive.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      # Same Foundry release as the local toolchain (P-8).
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.5

      - name: Contract tests
        working-directory: contracts/evm
        run: forge test
