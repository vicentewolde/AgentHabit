[package]
name = "commitment"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
soroban-sdk = { workspace = true, features = ["testutils"] }
