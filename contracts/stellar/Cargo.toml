# Cargo workspace for the Stellar side (P-3). Rooted here, not at the repo root:
# `contracts/` holds no package.json and is invisible to pnpm (P-2).
[workspace]
resolver = "2"
members = ["commitment"]

[workspace.dependencies]
# Resolved live in T2, not assumed (P-8): testnet runs protocol 29 (getVersionInfo on
# 2026-10-15, stellar-core 29.0.0) and 29.0.1 is the newest stable soroban-sdk on crates.io.
soroban-sdk = "29.0.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
