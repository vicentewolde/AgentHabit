# The pnpm workspace covers the TypeScript side only (P-2).
# `contracts/stellar` (Cargo) and `contracts/evm` (Foundry) are separate workspaces with no
# package.json: pnpm never sees them. The only bridge is `deployments/*.json`.
packages:
  - "apps/*"
  - "packages/*"

# Each build script is approved one by one, with its reason (CLAUDE.md, rule 10).
allowBuilds:
  # esbuild (through tsx) only verifies its binary in postinstall; the binary arrives as a
  # per-platform optional dependency, so its script never needs to run. Same as AgentSales.
  esbuild: false
